<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Anti-DDoS maison avec XDP et eBPF">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1040" cy="150" r="220" fill="#ff6b6b" opacity="0.08"/>
  <circle cx="980" cy="480" r="160" fill="#58a6ff" opacity="0.07"/>

  <g stroke="#30363d" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 900 90 L 1000 90 L 1000 190"/>
    <path d="M 950 250 L 1050 250 L 1050 350"/>
    <path d="M 880 400 L 980 400 L 980 500"/>
  </g>

  <text x="78" y="230" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#8b949e">TUTORIEL · RÉSEAU · CYBERSÉCURITÉ</text>

  <text x="78" y="330" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#title)">Anti-DDoS</text>
  <text x="78" y="422" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#f0f6fc">maison XDP</text>

  <text x="78" y="480" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="30" font-weight="600" fill="#8b949e">eBPF · Filtrage au niveau du pilote réseau · Debian 13</text>

  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="22" fill="#58a6ff" opacity="0.85">
    <text x="80" y="560">XDP_DROP</text>
    <text x="260" y="560" fill="#3fb950">XDP_PASS</text>
    <text x="440" y="560" fill="#f0883e">bpftool</text>
    <text x="600" y="560" fill="#a371f7">xdp-filter</text>
  </g>
</svg>
