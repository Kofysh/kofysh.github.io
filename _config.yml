# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: fr-FR
timezone: Europe/Paris

title: Blog de Kofy
tagline: Auto-hébergement, homelab et administration Linux
description: >-
  Blog francophone sur l'auto-hébergement, le homelab, Docker et l'administration de serveurs Linux.

url: "https://yipyip.fr"

github:
  username: kofysh
twitter:
  username: kofyspace

social:
  name: Kofy
  email: kofy@yipyip.fr
  links:
    - https://twitter.com/kofyspace
    - https://github.com/kofysh

plugins:
  - jekyll-archives
  - jekyll-redirect-from
  - jekyll-sitemap

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:
    domain:

pageviews:
  provider:

theme_mode:
cdn:
avatar: /assets/img/pp.png
social_preview_image: /assets/img/pp.png
toc: true

comments:
  provider: giscus
  giscus:
    repo: Kofysh/kofysh.github.io
    repo_id:
    category: General
    category_id:
    mapping: pathname
    strict: 0
    input_position: bottom
    lang: fr
    reactions_enabled: 1

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:
      - "/posts/"
      - "/categories/"
      - "/tags/"

paginate: 10
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
